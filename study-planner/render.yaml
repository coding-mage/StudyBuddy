services:
  - type: web
    name: studybuddy
    env: python
    plan: free
    rootDir: study-planner
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OLLAMA_HOST
        value: http://localhost:11434
